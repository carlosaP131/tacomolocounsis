<div class="tab-content">
  <div *ngIf="cargandoMenu" class="text-center py-5">
    <div class="spinner-border text-orange" role="status"></div>
    <p class="mt-2 text-muted">Cocinando el menú...</p>
  </div>

  <div *ngIf="!cargandoMenu" class="animate-fade-in">
    <div class="row g-3">
      
      <div class="col-md-6" *ngFor="let producto of platillosFiltrados">
        <div class="card h-100 border-0 shadow-sm rounded-4 menu-card transition-all">
          <div class="card-body p-4 position-relative">
            
            <span *ngIf="producto.etiqueta" 
                  class="position-absolute top-0 end-0 fw-bold px-3 py-1 text-white" 
                  [ngClass]="producto.etiqueta === 'Popular' ? 'bg-danger' : 'bg-warning text-dark'"
                  style="border-bottom-left-radius: 16px; border-top-right-radius: 16px; font-size: 13px;">
              {{ producto.etiqueta }}
            </span>

            <h3 class="h5 fw-bold text-dark pt-2 mb-2">{{ producto.nombre }}</h3>
            <p class="text-muted small">{{ producto.descripcion }}</p>
            
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light">
              <span class="fw-black text-dark h5 mb-0" style="font-weight: 800;">
                ${{ producto.precio }} {{ producto.categoria === 'trompo' ? 'c/u' : '' }}
              </span>
              
              <button class="btn btn-sm btn-outline-orange rounded-pill px-3 fw-bold" 
                      (click)="agregarAlCarrito(producto.id, producto.nombre, producto.precio)">
                Agregar ➕
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 text-center py-5" *ngIf="platillosFiltrados.length === 0">
        <p class="text-muted">Próximamente más delicias en esta categoría... 🌮</p>
      </div>

    </div>
  </div>
</div>
